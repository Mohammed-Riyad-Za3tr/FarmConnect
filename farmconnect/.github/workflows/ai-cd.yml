name: Deploy AI Service

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run validation only without triggering deploy"
        required: false
        default: "false"
  push:
    branches: [main]
    paths:
      - "apps/ai-service/**"
      - ".github/workflows/ai-cd.yml"

concurrency:
  group: ai-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-ai:
    name: Validate AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r apps/ai-service/requirements.txt

      - name: Run tests
        run: |
          cd apps/ai-service
          python -m pytest -q

      - name: Build Docker image smoke check
        run: docker build -f apps/ai-service/Dockerfile -t farmconnect-ai-ci ./apps/ai-service

  deploy-ai:
    name: Trigger AI Deploy Hook
    runs-on: ubuntu-latest
    needs: validate-ai
    if: ${{ github.event_name == 'push' || inputs.dry_run != 'true' }}

    steps:
      - name: Trigger deploy hook (Render/Railway)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_AI }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_AI is not configured"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"

  dry-run-note:
    name: Dry Run Summary
    runs-on: ubuntu-latest
    needs: validate-ai
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}

    steps:
      - name: Print dry run result
        run: echo "AI service dry run completed successfully (deploy hook skipped)."
