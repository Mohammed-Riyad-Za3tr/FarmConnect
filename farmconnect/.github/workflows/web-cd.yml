name: Deploy Web

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build/test only without triggering deploy"
        required: false
        default: "false"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - ".github/workflows/web-cd.yml"

concurrency:
  group: web-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-web:
    name: Validate Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @farmconnect/web test:ci

      - name: Build
        run: pnpm --filter @farmconnect/web build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  deploy-web:
    name: Trigger Web Deploy Hook
    runs-on: ubuntu-latest
    needs: validate-web
    if: ${{ github.event_name == 'push' || inputs.dry_run != 'true' }}

    steps:
      - name: Trigger deploy hook (Render/Railway)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_WEB is not configured"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"

  dry-run-note:
    name: Dry Run Summary
    runs-on: ubuntu-latest
    needs: validate-web
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}

    steps:
      - name: Print dry run result
        run: echo "Web dry run completed successfully (deploy hook skipped)."
